name: Generate F-Droid repo

on: 
  repository_dispatch:
    types: [fdroid-update]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apps:
    name: "Generate repo from apps listing"
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v2

      - name: Create basic directory structure
        run: mkdir -p fdroid/repo

      - name: Restore correct mtime
        run: |
          sudo apt install git-restore-mtime 
          git restore-mtime

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Install F-Droid server software
        run: |
         sudo add-apt-repository ppa:fdroid/fdroidserver
         sudo apt-get update
         sudo apt install apksigner
         # sudo apt-get install fdroidserver
          
      - name: Istall fdroidserver
        run: |
          pip install git+https://gitlab.com/fdroid/fdroidserver.git
          fdroid --version
          
      - name: Set up repo secrets
        run: |
          echo "${{ secrets.FDROID_KEYSTORE_P12 }}" | base64 -d - > fdroid/keystore.p12
          echo "${{ secrets.FDROID_CONFIG_YML }}" | base64 -d - > fdroid/config.yml
          
      - uses: actions/setup-go@v2
        name: Set up Go
        with:
          go-version: '^1.25.1'

      - name: Force download correct F-Droid universal APK
        run: |
          cd fdroid/repo
          VERSION=$(gh release view --repo wgtunnel/wgtunnel --json tagName -q .tagName | sed 's/^v//')
          gh release download --repo wgtunnel/wgtunnel --pattern "wgtunnel-fdroid-v${VERSION}.apk" --clobber
          mv "wgtunnel-fdroid-v${VERSION}.apk" "wgtunnel_${VERSION}.apk"
          ls -lh wgtunnel_*.apk
        
      - name: Run update script
        run: bash update.sh 2>&1
        env:
          GH_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}

